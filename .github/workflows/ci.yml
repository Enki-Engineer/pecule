name: Contrôles

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Une commande qui échoue au milieu d'un tube arrête l'étape.
defaults:
  run:
    shell: bash

jobs:
  controles:
    runs-on: ubuntu-latest
    services:
      base:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: pecule-ci
          MARIADB_DATABASE: pecule
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
      # Les deux autres bases annoncées par le guide : la plus ancienne MariaDB admise, et MySQL.
      base-mariadb-10-6:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: pecule-ci
          MARIADB_DATABASE: pecule
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
      base-mysql-8-4:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pecule-ci
          MYSQL_DATABASE: pecule
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppecule-ci"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.6.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Démarrage sur une base vide
        env:
          NODE_ENV: production
          PORT: 3000
          APP_URL: http://localhost:3000
          DATABASE_URL: mysql://root:pecule-ci@127.0.0.1:3306/pecule
          API_TOKEN: jeton-des-controles-automatiques-0123456789
          SYNC_TOKEN: jeton-de-synchro-des-controles-0123456789
          SYNC_INTERVAL_MINUTES: 0
        run: |
          node dist/server.mjs &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/api/health | grep -q '"phase":"pret"' && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/api/health | grep '"phase":"pret"'
          curl -sf http://127.0.0.1:3000/api/auth/me | grep '"setup":true'
          node scripts/doctor.mjs --url http://127.0.0.1:3000 --fichier /dev/null || true

      # Une installation neuve doit démarrer sur toutes les bases que le guide annonce, pas seulement sur celle du
      # développement : le schéma de départ a déjà porté une collation que seule MariaDB 10.10 et plus connaît.
      # Puis chaque lecture y est appelée (scripts/sonde-lectures.mjs) : une requête que MariaDB accepte peut être
      # refusée par MySQL 8 — un regroupement par un alias qui porte le nom d'une colonne, par exemple.
      - name: Démarrage et lectures sur MariaDB 10.6 et sur MySQL 8.4
        env:
          NODE_ENV: production
          API_TOKEN: jeton-des-controles-automatiques-0123456789
          SYNC_TOKEN: jeton-de-synchro-des-controles-0123456789
          SETUP_CODE: code-des-controles-automatiques
          SYNC_INTERVAL_MINUTES: 0
          UPDATE_CHECK: 0
        run: |
          for base in 3307 3308; do
            port=$((base - 200))
            PORT=$port APP_URL=http://localhost:$port DATABASE_URL=mysql://root:pecule-ci@127.0.0.1:$base/pecule node dist/server.mjs > "$RUNNER_TEMP/base-$base.log" 2>&1 &
            for i in $(seq 1 30); do
              curl -sf http://127.0.0.1:$port/api/health | grep -q '"phase":"pret"' && break
              sleep 2
            done
            curl -sf http://127.0.0.1:$port/api/health | grep '"phase":"pret"' || { cat "$RUNNER_TEMP/base-$base.log"; exit 1; }
            curl -sf http://127.0.0.1:$port/api/auth/me | grep '"setup":true'
            node scripts/sonde-lectures.mjs --url http://127.0.0.1:$port --jeton "$API_TOKEN" --code "$SETUP_CODE" || { tail -n 60 "$RUNNER_TEMP/base-$base.log"; exit 1; }
          done

      # L'archive prête à l'emploi, telle qu'une version la publie : dépliée hors du dépôt, elle doit démarrer sur une
      # base vide avec Node seul — ni pnpm, ni build, ni dépendance prise ailleurs que dans l'archive.
      - name: Archive prête à l'emploi
        run: |
          node scripts/paquet.mjs
          ( cd dist/paquet && sha256sum --check SHA256SUMS )
          # Le paquet npm tel qu'il se publie — empaqueté, installé hors du dépôt — : c'est lui qui déplie l'archive.
          npm pack ./dist/paquet/npm --pack-destination "$RUNNER_TEMP" > /dev/null
          npm install --global --prefix "$RUNNER_TEMP/npm" "$RUNNER_TEMP/create-pecule-$(node -p "require('./package.json').version").tgz" > /dev/null
          mkdir -p "$RUNNER_TEMP/archive" && ( cd "$RUNNER_TEMP/archive" && "$RUNNER_TEMP/npm/bin/create-pecule" --archive "$GITHUB_WORKSPACE/dist/paquet/pecule.tar.gz" )
          unzip -q dist/paquet/pecule.zip -d "$RUNNER_TEMP/archive-zip" && diff -rq "$RUNNER_TEMP/archive/pecule" "$RUNNER_TEMP/archive-zip/pecule"
          mysql -h127.0.0.1 -uroot -ppecule-ci -e "CREATE DATABASE pecule_archive" 2>/dev/null \
            || docker exec "$(docker ps -q --filter ancestor=mariadb:11.8 | head -1)" mariadb -uroot -ppecule-ci -e "CREATE DATABASE pecule_archive"
          cd "$RUNNER_TEMP/archive/pecule"
          NODE="$(dirname "$(command -v node)")"
          env -i PATH="$NODE:/usr/bin:/bin" HOME="$HOME" node scripts/setup.mjs --base "mysql://root:pecule-ci@127.0.0.1:3306/pecule_archive" --port 3100 --json | grep -q '"ok":true'
          echo "BACKUP_DIR=$RUNNER_TEMP/sauvegardes" >> .env
          env -i PATH="$NODE:/usr/bin:/bin" HOME="$HOME" node dist/server.mjs > "$RUNNER_TEMP/archive.log" 2>&1 &
          env -i PATH="$NODE:/usr/bin:/bin" HOME="$HOME" node scripts/lien.mjs --json | tee "$RUNNER_TEMP/lien.json" | grep -q '"setup":true' || { cat "$RUNNER_TEMP/archive.log"; exit 1; }
          env -i PATH="$NODE:/usr/bin:/bin" HOME="$HOME" node scripts/doctor.mjs
          env -i PATH="$NODE:/usr/bin:/bin" HOME="$HOME" node scripts/maj.mjs --verifier --json | grep -q '"source": "archive"'

  # L'installation Docker telle que la décrit le guide : un dossier qui ne contient que compose.yaml, aucun fichier
  # de réglages, l'image construite depuis ce commit.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: pecule:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Installation neuve, sans fichier de réglages
        env:
          PECULE_IMAGE: pecule:ci
        run: |
          mkdir -p "$RUNNER_TEMP/installation" && cp compose.yaml "$RUNNER_TEMP/installation/" && cd "$RUNNER_TEMP/installation"
          docker compose version
          docker compose up -d
          docker compose exec -T pecule node scripts/lien.mjs --json | tee lien.json
          grep -q '"setup":true' lien.json && grep -q '"link":"http://localhost:3000/#code=' lien.json
          docker compose exec -T pecule node scripts/doctor.mjs | tee doctor.txt
          grep -q 'Mode démo disponible' doctor.txt
          curl -sf http://127.0.0.1:3000/api/health | grep '"phase":"pret"'
      - name: Premier membre, puis second démarrage avec les mêmes secrets
        env:
          PECULE_IMAGE: pecule:ci
        run: |
          cd "$RUNNER_TEMP/installation"
          CODE="$(jq -r .code lien.json)"
          curl -sf -X POST http://127.0.0.1:3000/api/auth/setup -H 'Content-Type: application/json' -d "{\"name\":\"Alex\",\"code\":\"$CODE\"}" | grep -q '"link"'
          AVANT="$(docker compose exec -T pecule sha256sum data/reglages/pecule.env)"
          docker compose up -d --force-recreate
          docker compose exec -T pecule node scripts/lien.mjs --json | grep -q '"member":"Alex"'
          test "$AVANT" = "$(docker compose exec -T pecule sha256sum data/reglages/pecule.env)"
          docker compose exec -T pecule node scripts/doctor.mjs --json | grep -q '"id": "version"'
      - name: Journal, en cas d'échec
        if: failure()
        run: cd "$RUNNER_TEMP/installation" && docker compose ps -a && docker compose logs --tail 80
