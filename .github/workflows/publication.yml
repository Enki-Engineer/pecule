name: Publication

# Une étiquette « v1.22.0 » poussée sur le dépôt publie la version : image Docker (amd64 et arm64) sur ghcr.io,
# version GitHub avec ses formats en pièces jointes (compose.yaml, l'archive prête à l'emploi, l'appli de bureau pour
# Mac, leurs empreintes) et
# pour notes le tableau « Installer ou mettre à jour » puis la section du journal des versions, et branche « stable »
# avancée jusqu'à elle. L'étiquette doit être celle de la version de package.json, et CHANGELOG.md doit avoir sa
# section : sinon rien n'est publié.
on:
  push:
    tags: ["v*.*.*"]

# Les actions sont épinglées par l'empreinte de leur commit (la version est en commentaire, Dependabot les tient à
# jour) : une étiquette d'action déplacée ne fait pas tourner un autre code dans un flux qui peut publier.
permissions:
  contents: write
  packages: write
  # Attestation de provenance des pièces jointes et de l'image (signée par l'identité de ce flux, pas par un secret).
  id-token: write
  attestations: write

concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # L'étiquette et le journal des versions d'abord : une étiquette qui n'est pas celle du paquet n'occupe pas une
  # machine Mac pendant un quart d'heure.
  etiquette:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/notes-de-version.mjs --etiquette "$GITHUB_REF_NAME" > /dev/null

  # L'appli de bureau pour Mac : fabriquée, essayée dans sa fenêtre, puis signée pour les mises à jour. Une version
  # déjà publiée ne reçoit plus de pièce jointe : l'appli doit être prête avant que la version ne soit créée, et une
  # appli qui ne se fabrique pas ou ne passe pas sa recette empêche la publication.
  bureau:
    needs: etiquette
    permissions:
      contents: read
    uses: ./.github/workflows/bureau.yml

  # La signature de l'archive de mise à jour, sur une machine neuve : elle n'a rien compilé ni joué, ne reçoit que
  # l'archive et ses empreintes, et n'exécute que l'outil de signature (les paquets y sont posés sans lancer leurs
  # scripts). La clé est un secret de l'environnement « publication », que seules les étiquettes de version peuvent
  # demander : une branche poussée sur le dépôt ne la lit pas. (Un secret d'environnement ne se lit que d'une étape du
  # flux appelant : c'est pourquoi la signature est ici, et pas dans le flux « Appli de bureau ».)
  signature:
    needs: bureau
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment: publication
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.6.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appli-mac
          path: dist/bureau
      - name: L'archive est celle que la machine Mac a fabriquée
        run: cd dist/bureau && sha256sum --check SHA256SUMS-mac
      - name: Signature de l'archive de mise à jour
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::La clé qui signe les mises à jour (secret TAURI_SIGNING_PRIVATE_KEY de l'environnement « publication ») manque : l'appli publiée ne pourrait pas se mettre à jour."; exit 1; }
          node bureau/fabriquer.mjs --signer --sortie dist/bureau
          test -s dist/bureau/pecule-mac.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appli-mac-mise-a-jour
          path: dist/bureau/pecule-mac.json
          if-no-files-found: error
          retention-days: 7

  publication:
    needs: signature
    runs-on: ubuntu-latest
    steps:
      # Tout l'historique, et toutes les branches : l'étape « Branche stable » doit savoir si cette version descend de
      # la pointe actuelle de « stable ». Avec un seul commit, git refuse de l'avancer (« fetch first »).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Le jeton du flux n'est pas laissé dans le dépôt cloné : le build, qui exécute le code des dépendances de
          # développement, n'a rien à y lire. Les étapes qui publient le reçoivent une à une.
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.6.0
      # Aucun cache partagé (ni pnpm, ni couches Docker) dans ce flux : ce qui est publié vient du fichier de
      # verrouillage, pas d'un cache qu'un autre flux aurait rempli. Depuis sa version 5, setup-node met de lui-même
      # en cache les dépendances d'un projet dont package.json déclare son gestionnaire de paquets : refusé ici en
      # toutes lettres, pour que ce flux reste sans cache le jour où le projet en déclarerait un.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Notes de la version (étiquette et journal contrôlés)
        run: node scripts/notes-de-version.mjs --etiquette "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      # Les pièces jointes d'abord : si elles ne se fabriquent pas, rien n'est publié.
      - name: Pièces jointes (compose.yaml, archive prête à l'emploi, empreintes)
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          node scripts/paquet.mjs
          ( cd dist/paquet && sha256sum --check SHA256SUMS )
      - name: Appli de bureau pour Mac (fabriquée et essayée par le flux « Appli de bureau »)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appli-mac
          path: dist/bureau
      - name: Appli de bureau — ce qui l'annonce aux mises à jour (signé à part, par le même flux)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appli-mac-mise-a-jour
          path: dist/bureau
      - name: Appli de bureau — empreintes, et version annoncée aux mises à jour
        run: |
          ( cd dist/bureau && sha256sum --check SHA256SUMS-mac )
          test "$(node -p "require('./dist/bureau/pecule-mac.json').version")" = "${GITHUB_REF_NAME#v}"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Rang de la version (les étiquettes flottantes ne reculent jamais)
        id: rang
        # « latest », « 1 » et « 1.22 » ne se posent que sur la version la plus haute — de toutes, de sa version majeure,
        # de sa série. Republier une ancienne étiquette, ou corriger une série passée, ne ramène donc pas en arrière
        # les installations qui suivent « latest » par `docker compose pull`.
        run: |
          v="${GITHUB_REF_NAME#v}"
          case "$v" in *-*) echo "Préversion : aucune étiquette flottante."; { echo "derniere=false"; echo "majeure=false"; echo "serie=false"; } >> "$GITHUB_OUTPUT"; exit 0 ;; esac
          publiees="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -v -- '-' | sed 's/^v//')"
          haute() { printf '%s\n' "$publiees" | grep -E "^$1" | sort -V | tail -n 1; }
          majeure="${v%%.*}"; serie="${v%.*}"
          rang() { if [ "$(haute "$2")" = "$v" ]; then echo "$1=true"; else echo "$1=false"; fi; }
          { rang derniere '[0-9]'; rang majeure "${majeure}\\."; rang serie "${serie//./\\.}\\."; } | tee -a "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # « latest » n'est jamais posée d'office : seulement par la ligne qui la donne à la version la plus haute.
          flavor: latest=false
          # 1.22.0 toujours ; 1.22, 1 et « latest » seulement si cette version est la plus haute de son rang.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.rang.outputs.serie == 'true' }}
            type=semver,pattern={{major}},enable=${{ steps.rang.outputs.majeure == 'true' }}
            type=raw,value=latest,enable=${{ steps.rang.outputs.derniere == 'true' }}
      - name: Image Docker
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Version sur GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          # « Dernière version » sur GitHub (celle que télécharge l'adresse stable des pièces jointes) : jamais une
          # version plus ancienne que celle qui l'est déjà.
          derniere="--latest=${{ steps.rang.outputs.derniere }}"
          fichiers=(dist/paquet/compose.yaml dist/paquet/pecule.tar.gz dist/paquet/pecule.zip dist/paquet/SHA256SUMS dist/bureau/Pecule-mac.zip dist/bureau/Pecule-mac.app.tar.gz dist/bureau/pecule-mac.sh dist/bureau/pecule-mac.json dist/bureau/SHA256SUMS-mac)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Version créée à la main sur GitHub : ses notes sont gardées, sauf si elle n'en a pas.
            if [ -z "$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)" ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
            fi
            # Versions immuables (réglage du dépôt) : une version déjà publiée ne reçoit plus de pièce jointe. Ses pièces
            # sont celles de sa première publication ; ce nouveau passage ne les remplace pas.
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isImmutable --jq .isImmutable)" = "true" ]; then
              echo "Version déjà publiée et immuable : ses pièces jointes ne sont pas remplacées."
            else
              gh release upload "$GITHUB_REF_NAME" "${fichiers[@]}" --clobber
            fi
          else
            gh release create "$GITHUB_REF_NAME" "${fichiers[@]}" --verify-tag --title "Pécule ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" $pre $derniere
          fi

      - name: Branche stable
        env:
          GH_TOKEN: ${{ github.token }}
        # Les installations qui suivent une branche, et les consignes que lit un agent IA (AGENTS.md à l'adresse de
        # « stable »), ne reçoivent que des versions publiées. Jamais de retour en arrière : une version plus ancienne
        # que « stable » (correctif d'une série passée) la laisse où elle est. Un envoi refusé arrête le flux : il
        # n'est jamais pris pour une branche déjà à jour.
        run: |
          case "$GITHUB_REF_NAME" in *-*) echo "Préversion : la branche stable ne bouge pas."; exit 0 ;; esac
          stable=refs/remotes/origin/stable
          if ! git rev-parse --verify --quiet "$stable" > /dev/null; then
            echo "Première version publiée : la branche stable est créée."
          elif [ "$(git rev-parse "$stable")" = "$GITHUB_SHA" ]; then
            echo "La branche stable est déjà sur cette version."; exit 0
          elif git merge-base --is-ancestor "$stable" "$GITHUB_SHA"; then
            echo "La branche stable avance jusqu'à cette version."
          elif git merge-base --is-ancestor "$GITHUB_SHA" "$stable"; then
            echo "La branche stable est déjà plus avancée : elle ne bouge pas."; exit 0
          else
            echo "::error::La branche stable et cette version ont divergé : elle n'a pas été avancée."; exit 1
          fi
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA:refs/heads/stable"

      # Provenance : une attestation signée (Sigstore, identité de ce flux) dit que l'archive et l'image ont été
      # fabriquées ici, à partir de ce commit. Elle se vérifie par `gh attestation verify` (docs/guide/mise-a-jour.md) ;
      # SHA256SUMS, téléchargé au même endroit que l'archive, ne protège lui que d'un téléchargement abîmé.
      # Dépôt public seulement : GitHub n'atteste pas un dépôt privé hors de ses offres Entreprise.
      - name: Attestation de provenance des pièces jointes
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/paquet/pecule.tar.gz
            dist/paquet/pecule.zip
            dist/paquet/compose.yaml
            dist/bureau/Pecule-mac.zip
            dist/bureau/Pecule-mac.app.tar.gz
            dist/bureau/pecule-mac.sh
      - name: Nom de l'image (en minuscules)
        id: nom
        if: ${{ !github.event.repository.private }}
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Attestation de provenance de l'image
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.nom.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          # Depuis sa version 4, l'action inscrit aussi l'image parmi les « artefacts liés » de l'organisation, ce qui
          # demande une permission de plus (artifact-metadata). L'attestation n'en a pas besoin : ce flux garde les
          # permissions qu'il avait, et n'inscrit rien.
          create-storage-record: false
