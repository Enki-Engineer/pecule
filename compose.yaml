# Pécule avec Docker : l'appli et sa base MariaDB. Réglages dans `.env` (écrit par `node scripts/setup.mjs --docker`).
#
#   docker compose up -d                 Pécule sur http://localhost:3000 (essai sur sa propre machine)
#   docker compose --profile https up -d  en plus, Caddy sert https://<PECULE_DOMAIN> (certificat automatique)
#
# L'image est celle qui est publiée à chaque version ; si elle ne peut pas être récupérée (hors ligne, copie du
# projet), elle est construite depuis ce dossier. `--build` la construit toujours depuis ce dossier.
# Mettre à jour : `node scripts/maj.mjs` (sauvegarde, nouvelle image, redémarrage, contrôle).
#
# Les clés d'accès (passkeys) exigent https ou localhost : sur un serveur, utiliser le profil « https » ou
# son propre proxy, et donner la même adresse dans APP_URL.
services:
  pecule:
    build: .
    # Une version précise plutôt que la dernière : PECULE_IMAGE=ghcr.io/enki-engineer/pecule:1.22.0 dans .env.
    image: ${PECULE_IMAGE:-ghcr.io/enki-engineer/pecule:latest}
    restart: unless-stopped
    env_file: ${PECULE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: mysql://pecule:${DB_PASSWORD}@base:3306/pecule
      DEMO_DATABASE_URL: mysql://pecule_demo:${DEMO_DB_PASSWORD}@base:3306/pecule_demo
      # Les sauvegardes du serveur vont dans le volume monté plus bas, quoi que dise `.env` : dans le conteneur
      # lui-même, elles disparaîtraient à chaque mise à jour. Pour les ranger ailleurs, changer ce qui est monté là.
      BACKUP_DIR: /app/data/sauvegardes
    depends_on:
      base:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PECULE_PORT:-3000}:3000"
    volumes:
      # Sauvegardes complètes écrites par le serveur : avant une migration, et les automatiques si on les demande.
      - pecule-sauvegardes:/app/data/sauvegardes

  base:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: pecule
      MARIADB_USER: pecule
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      DEMO_DB_PASSWORD: ${DEMO_DB_PASSWORD}
    command: ["--max-allowed-packet=256M"]
    volumes:
      - pecule-base:/var/lib/mysql
      - ./docker/base-init.sh:/docker-entrypoint-initdb.d/10-demo.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 40

  # https avec certificat automatique (Let's Encrypt) : `--profile https`, PECULE_DOMAIN dans .env, ports 80 et 443 ouverts.
  caddy:
    profiles: ["https"]
    image: caddy:2
    restart: unless-stopped
    command: caddy reverse-proxy --from ${PECULE_DOMAIN:-localhost} --to pecule:3000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - pecule-caddy:/data
    depends_on:
      - pecule

volumes:
  pecule-base:
  pecule-sauvegardes:
  pecule-caddy:
